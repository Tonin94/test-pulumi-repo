# Generato da cloud-pulumi: non modificare, viene riscritto a ogni generazione.
name: Deploy worker-test

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-worker-test.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: Migrations D1 (test-pulumi)
        run: npx wrangler d1 migrations apply test-pulumi --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
